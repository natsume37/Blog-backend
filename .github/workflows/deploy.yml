name: Deploy Backend

on:
  push:
    branches: [main]

env:
  DEPLOY_SSH_CONNECT_TIMEOUT: 30s
  DEPLOY_COMMAND_TIMEOUT: 25m

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 服务器无法访问 GitHub 时，通过 SSH 上传源码包完成部署。
      BACKEND_ARCHIVE: blog-backend-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.tgz
      BACKEND_ARCHIVE_PATH: ${{ runner.temp }}/blog-backend-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.tgz
      DEPLOY_SCRIPT: |
        # 遇到错误立即停止
        set -euo pipefail

        # 1. 通过 Actions 上传的源码包部署，避免服务器执行 git pull 访问 GitHub。
        DEPLOY_DIR="$HOME/work/blog/Blog-backend"
        ARCHIVE="/tmp/blog-backend-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.tgz"
        RELEASE_ROOT="$HOME/work/blog/.backend-releases"
        BACKUP_ROOT="$HOME/work/blog/.backend-backups"
        RELEASE_ID="${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
        STAGING="$RELEASE_ROOT/$RELEASE_ID"
        BACKUP="$BACKUP_ROOT/$RELEASE_ID"
        BACKUP_ARCHIVE="$BACKUP/payload.tgz"
        restore_needed=0

        rollback() {
            local code=$?
            if [ "$code" -ne 0 ] && [ "$restore_needed" -eq 1 ] && [ -f "$BACKUP_ARCHIVE" ]; then
                echo "Deployment failed, restoring the previous backend source."
                find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 \
                    ! -name ".env.prod" ! -name ".venv" ! -name "logs" \
                    ! -name ".git" ! -name ".codegraph" -exec rm -rf {} +
                tar -xzf "$BACKUP_ARCHIVE" -C "$DEPLOY_DIR"
            fi
            rm -rf "$STAGING"
            if [ "$code" -eq 0 ]; then
                rm -f "$ARCHIVE"
            fi
            exit "$code"
        }
        trap rollback EXIT

        mkdir -p "$DEPLOY_DIR" "$STAGING" "$BACKUP"
        test -s "$ARCHIVE"
        tar -xzf "$ARCHIVE" -C "$STAGING"
        test -f "$STAGING/pyproject.toml"

        # 在替换源码前保留可回滚的旧版本，运行环境文件和虚拟环境不参与覆盖。
        if find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 \
            ! -name ".env.prod" ! -name ".venv" ! -name "logs" \
            ! -name ".git" ! -name ".codegraph" -print -quit | grep -q .; then
            tar -C "$DEPLOY_DIR" \
                --exclude=".env.prod" --exclude=".venv" --exclude="logs" \
                --exclude=".git" --exclude=".codegraph" \
                -czf "$BACKUP_ARCHIVE" .
        fi

        restore_needed=1
        find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 \
            ! -name ".env.prod" ! -name ".venv" ! -name "logs" \
            ! -name ".git" ! -name ".codegraph" -exec rm -rf {} +
        cp -a "$STAGING"/. "$DEPLOY_DIR"/
        cd "$DEPLOY_DIR"

        # 1.1 关键 Secret 预检查（为空时直接失败，避免迁移阶段才报错）
        if [ -z "${{ secrets.SECRET_KEY }}" ]; then
            echo "ERROR: GitHub secret SECRET_KEY is missing or empty."
            exit 1
        fi

        # 2. 注入环境变量 (从 GitHub Secrets)
        echo "Generating .env.prod file..."
        cat <<'EOF' > .env.prod.tmp
        # --- 基础配置 ---
        APP_NAME=Blog-Backend
        APP_VERSION=1.0.0
        ENVIRONMENT=production
        DEBUG=false
        HOST=0.0.0.0
        PORT=8090
        API_V1_PREFIX=/api/v1

        # --- 数据库 & Redis ---
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        DATABASE_POOL_SIZE=20
        DATABASE_MAX_OVERFLOW=10
        REDIS_URL=${{ secrets.REDIS_URL }}

        # --- 微信读书同步 ---
        WEREAD_API_KEY=${{ secrets.WEREAD_API_KEY }}
        WEREAD_SYNC_ENABLED=true
        WEREAD_SYNC_INTERVAL_MINUTES=30
        WEREAD_SKILL_VERSION=1.0.3

        # --- 日志 ---
        LOG_LEVEL=INFO
        LOG_FILE_PATH=./logs

        # --- 安全 ---
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        ALGORITHM=HS256
        ACCESS_TOKEN_EXPIRE_MINUTES=10080
        FRONTEND_BASE_URL=${{ secrets.OAUTH_FRONTEND_BASE_URL }}
        GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
        GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        GITHUB_REDIRECT_URI=${{ secrets.OAUTH_GITHUB_REDIRECT_URI }}
        GITHUB_OAUTH_SCOPE=read:user user:email

        # --- 邮件服务 ---
        SMTP_HOST=${{ secrets.SMTP_HOST }}
        SMTP_PORT=${{ secrets.SMTP_PORT }}
        SMTP_USER=${{ secrets.SMTP_USER }}
        SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
        EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
        EMAILS_FROM_NAME=${{ secrets.EMAILS_FROM_NAME }}

        # --- 七牛云 ---
        QINIU_ACCESS_KEY=${{ secrets.QINIU_ACCESS_KEY }}
        QINIU_SECRET_KEY=${{ secrets.QINIU_SECRET_KEY }}
        QINIU_BUCKET=${{ secrets.QINIU_BUCKET }}
        QINIU_DOMAIN=${{ secrets.QINIU_DOMAIN }}

        # --- 七牛云时间戳防盗链 ---
        QINIU_TIMESTAMP_ENABLED=${{ secrets.QINIU_TIMESTAMP_ENABLED }}
        QINIU_TIMESTAMP_KEY=${{ secrets.QINIU_TIMESTAMP_KEY }}
        QINIU_TIMESTAMP_EXPIRE=${{ secrets.QINIU_TIMESTAMP_EXPIRE }}
        
        # --- 安全加强 (防盗链) ---
        # 请在 GitHub Secrets 中配置 CORS_ORIGINS 为 JSON 格式数组，例如: ["https://martin88.xyz", "https://www.martin88.xyz"]
        CORS_ORIGINS='${{ secrets.CORS_ORIGINS }}'
        ENABLE_REFERER_CHECK=${{ secrets.ENABLE_REFERER_CHECK }}

        # --- GeoIP ---
        GEOIP_ENABLED=true
        GEOIP_PROVIDER_URL=https://api.ip2location.io/?ip={ip}
        EOF
        chmod 600 .env.prod.tmp
        mv .env.prod.tmp .env.prod

        # 3. 确保 uv 已安装 (如果服务器是新的，这步会自动安装)
        if ! command -v uv &> /dev/null; then
            echo "Installing uv..."
            curl -LsSf https://astral.sh/uv/install.sh | sh
            source $HOME/.cargo/env
        fi

        # 4. 同步依赖
        # 生产环境仅同步运行依赖，避免 dev 依赖拖慢部署。
        echo "Syncing dependencies..."
        uv sync --frozen --no-dev

        # 5. 执行数据库迁移 (复用已同步的环境，不再触发额外 sync)
        echo "Running database migrations..."
        ENVIRONMENT=production uv run --frozen --no-sync --no-dev alembic upgrade head

        # 6. 重启服务
        sudo systemctl restart fastapi-blog.service

        echo "Deployment successful!"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Pack backend source
        shell: bash
        run: |
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='.codegraph' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            -czf "$BACKEND_ARCHIVE_PATH" .

      - name: Upload backend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: ${{ env.BACKEND_ARCHIVE_PATH }}
          target: /tmp
          timeout: ${{ env.DEPLOY_SSH_CONNECT_TIMEOUT }}
          command_timeout: ${{ env.DEPLOY_COMMAND_TIMEOUT }}
          overwrite: true

      - name: Deploy to Server via SSH (Attempt 1)
        id: deploy_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: ${{ env.DEPLOY_SSH_CONNECT_TIMEOUT }}
          command_timeout: ${{ env.DEPLOY_COMMAND_TIMEOUT }}
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait Before Retry 2
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 15

      - name: Deploy to Server via SSH (Attempt 2)
        if: steps.deploy_1.outcome == 'failure'
        id: deploy_2
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: ${{ env.DEPLOY_SSH_CONNECT_TIMEOUT }}
          command_timeout: ${{ env.DEPLOY_COMMAND_TIMEOUT }}
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait Before Retry 3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: sleep 15

      - name: Deploy to Server via SSH (Attempt 3)
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        id: deploy_3
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: ${{ env.DEPLOY_SSH_CONNECT_TIMEOUT }}
          command_timeout: ${{ env.DEPLOY_COMMAND_TIMEOUT }}
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Fail When All Deploy Attempts Failed
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure'
        run: |
          echo "Backend deploy failed after 3 SSH attempts."
          exit 1
