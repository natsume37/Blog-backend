name: Deploy Backend (Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_SSH_CONNECT_TIMEOUT: 30s
  DEPLOY_COMMAND_TIMEOUT: 30m
  IMAGE_NAME: blog-backend
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_ARCHIVE: blog-backend-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.images.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_SCRIPT: |
        set -euo pipefail

        DEPLOY_DIR="$HOME/work/blog/Blog-backend-docker"
        COMPOSE_FILE="$DEPLOY_DIR/compose.production.yml"
        REMOTE_UPLOAD_DIR="/tmp/blog-backend-deploy-${{ github.run_id }}-${{ github.run_attempt }}"
        IMAGE_ARCHIVE="$REMOTE_UPLOAD_DIR/blog-backend-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}.images.tar.gz"
        REMOTE_COMPOSE="$REMOTE_UPLOAD_DIR/compose.production.yml"
        IMAGE_REF="blog-backend:${{ github.sha }}"
        PREVIOUS_IMAGE=""

        if ! command -v docker >/dev/null 2>&1; then
            echo "ERROR: Docker is not installed on the server."
            exit 1
        fi

        DOCKER_USE_SUDO=0
        if ! docker info >/tmp/blog-docker-info.err 2>&1; then
            # Docker CLI 已存在但 daemon 可能尚未启动，先尝试恢复服务。
            sudo -n systemctl start docker >/tmp/blog-docker-start.err 2>&1 || true
            if ! docker info >/tmp/blog-docker-info.err 2>&1; then
                if sudo -n docker info >/tmp/blog-docker-sudo-info.err 2>&1; then
                    DOCKER_USE_SUDO=1
                else
                    echo "ERROR: Docker daemon or permissions are unavailable."
                    cat /tmp/blog-docker-info.err || true
                    cat /tmp/blog-docker-start.err || true
                    cat /tmp/blog-docker-sudo-info.err || true
                    sudo -n systemctl status docker --no-pager || true
                    exit 1
                fi
            fi
        fi
        echo "Docker daemon is ready (sudo=$DOCKER_USE_SUDO)."

        docker_cmd() {
            if [ "$DOCKER_USE_SUDO" -eq 1 ]; then
                sudo -n docker "$@"
            else
                docker "$@"
            fi
        }

        mkdir -p "$DEPLOY_DIR"
        echo "Checking uploaded Docker bundle in $REMOTE_UPLOAD_DIR..."
        ls -la "$REMOTE_UPLOAD_DIR"
        if [ ! -s "$IMAGE_ARCHIVE" ]; then
            echo "ERROR: Docker image archive is missing or empty: $IMAGE_ARCHIVE"
            exit 1
        fi
        if [ ! -s "$REMOTE_COMPOSE" ]; then
            echo "ERROR: Compose file is missing or empty: $REMOTE_COMPOSE"
            exit 1
        fi
        echo "Loading Docker image bundle..."
        docker_cmd load < "$IMAGE_ARCHIVE"
        echo "Docker image bundle loaded."
        cp "$REMOTE_COMPOSE" "$COMPOSE_FILE"

        if ! docker_cmd compose version; then
            echo "ERROR: Docker Compose plugin is unavailable."
            exit 1
        fi

        # 关键 Secret 预检查，避免启动容器后才发现生产配置缺失。
        if [ -z "${{ secrets.SECRET_KEY }}" ]; then
            echo "ERROR: GitHub secret SECRET_KEY is missing or empty."
            exit 1
        fi

        # 应用运行时配置由 GitHub Secrets 注入，数据库与 Redis 使用 Docker 内部服务名。
        cat <<'EOF' > "$DEPLOY_DIR/.env.prod.tmp"
        APP_NAME=Blog-Backend
        APP_VERSION=1.0.0
        ENVIRONMENT=production
        DEBUG=false
        HOST=0.0.0.0
        PORT=8090
        API_V1_PREFIX=/api/v1
        DATABASE_URL=postgresql+psycopg://blog:docker-internal@db:5432/blog
        DATABASE_POOL_SIZE=20
        DATABASE_MAX_OVERFLOW=10
        REDIS_HOST=redis
        REDIS_PORT=6379
        REDIS_DB=0
        WEREAD_API_KEY=${{ secrets.WEREAD_API_KEY }}
        WEREAD_SYNC_ENABLED=true
        WEREAD_SYNC_INTERVAL_MINUTES=30
        WEREAD_SKILL_VERSION=1.0.3
        LOG_LEVEL=INFO
        LOG_FILE_PATH=./logs
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        ALGORITHM=HS256
        ACCESS_TOKEN_EXPIRE_MINUTES=10080
        FRONTEND_BASE_URL=${{ secrets.OAUTH_FRONTEND_BASE_URL }}
        GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
        GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        GITHUB_REDIRECT_URI=${{ secrets.OAUTH_GITHUB_REDIRECT_URI }}
        GITHUB_OAUTH_SCOPE=read:user user:email
        SMTP_HOST=${{ secrets.SMTP_HOST }}
        SMTP_PORT=${{ secrets.SMTP_PORT }}
        SMTP_USER=${{ secrets.SMTP_USER }}
        SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
        EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
        EMAILS_FROM_NAME=${{ secrets.EMAILS_FROM_NAME }}
        QINIU_ACCESS_KEY=${{ secrets.QINIU_ACCESS_KEY }}
        QINIU_SECRET_KEY=${{ secrets.QINIU_SECRET_KEY }}
        QINIU_BUCKET=${{ secrets.QINIU_BUCKET }}
        QINIU_DOMAIN=${{ secrets.QINIU_DOMAIN }}
        QINIU_TIMESTAMP_ENABLED=${{ secrets.QINIU_TIMESTAMP_ENABLED }}
        QINIU_TIMESTAMP_KEY=${{ secrets.QINIU_TIMESTAMP_KEY }}
        QINIU_TIMESTAMP_EXPIRE=${{ secrets.QINIU_TIMESTAMP_EXPIRE }}
        CORS_ORIGINS='${{ secrets.CORS_ORIGINS }}'
        ENABLE_REFERER_CHECK=${{ secrets.ENABLE_REFERER_CHECK }}
        GEOIP_ENABLED=true
        GEOIP_PROVIDER_URL=https://api.ip2location.io/?ip={ip}
        EOF
        chmod 600 "$DEPLOY_DIR/.env.prod.tmp"
        mv "$DEPLOY_DIR/.env.prod.tmp" "$DEPLOY_DIR/.env.prod"

        # 首次部署生成全新的数据库和 Redis 凭据；后续发布复用它们。
        if [ ! -f "$DEPLOY_DIR/.env.docker" ]; then
            if ! command -v openssl >/dev/null 2>&1; then
                echo "ERROR: openssl is required to initialize Docker credentials."
                exit 1
            fi
            POSTGRES_PASSWORD="$(openssl rand -hex 32)"
            REDIS_PASSWORD="$(openssl rand -hex 32)"
            cat <<EOF > "$DEPLOY_DIR/.env.docker"
        POSTGRES_DB=blog
        POSTGRES_USER=blog
        POSTGRES_PASSWORD=$POSTGRES_PASSWORD
        REDIS_PASSWORD=$REDIS_PASSWORD
        EOF
        fi

        PREVIOUS_IMAGE="$(sed -n 's/^BACKEND_IMAGE=//p' "$DEPLOY_DIR/.env.docker" | tail -n 1 || true)"
        grep -v '^BACKEND_IMAGE=' "$DEPLOY_DIR/.env.docker" > "$DEPLOY_DIR/.env.docker.tmp" || true
        printf 'BACKEND_IMAGE=%s\n' "$IMAGE_REF" >> "$DEPLOY_DIR/.env.docker.tmp"
        chmod 600 "$DEPLOY_DIR/.env.docker.tmp"
        mv "$DEPLOY_DIR/.env.docker.tmp" "$DEPLOY_DIR/.env.docker"

        set -a
        . "$DEPLOY_DIR/.env.docker"
        set +a

        compose() {
            docker_cmd compose --env-file "$DEPLOY_DIR/.env.docker" -f "$COMPOSE_FILE" "$@"
        }

        rollback() {
            local code=$?
            if [ "$code" -ne 0 ] && [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Docker deployment failed, restoring previous image: $PREVIOUS_IMAGE"
                grep -v '^BACKEND_IMAGE=' "$DEPLOY_DIR/.env.docker" > "$DEPLOY_DIR/.env.docker.tmp" || true
                printf 'BACKEND_IMAGE=%s\n' "$PREVIOUS_IMAGE" >> "$DEPLOY_DIR/.env.docker.tmp"
                mv "$DEPLOY_DIR/.env.docker.tmp" "$DEPLOY_DIR/.env.docker"
                compose up -d backend || true
            fi
            # 失败时保留上传包，确保后续 SSH 重试仍可重新加载镜像；成功后再清理。
            if [ "$code" -eq 0 ]; then
                rm -f "$IMAGE_ARCHIVE" "$REMOTE_COMPOSE"
                rmdir "$REMOTE_UPLOAD_DIR" 2>/dev/null || true
            else
                echo "Docker deployment failed; retaining $REMOTE_UPLOAD_DIR for retry diagnostics."
            fi
            exit "$code"
        }
        trap rollback EXIT

        echo "Starting PostgreSQL and Redis containers..."
        compose up -d db redis

        database_ready=0
        redis_ready=0
        for _ in $(seq 1 30); do
            if compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                database_ready=1
            fi
            if compose exec -T redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then
                redis_ready=1
            fi
            if [ "$database_ready" -eq 1 ] && [ "$redis_ready" -eq 1 ]; then
                break
            fi
            sleep 2
        done
        if [ "$database_ready" -ne 1 ] || [ "$redis_ready" -ne 1 ]; then
            echo "ERROR: Docker database or Redis did not become ready."
            exit 1
        fi

        echo "Running database migrations in the new PostgreSQL container..."
        compose run --rm backend alembic upgrade head

        compose up -d --remove-orphans backend

        backend_ready=0
        for _ in $(seq 1 30); do
            if compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/docs', timeout=3)" >/dev/null 2>&1; then
                backend_ready=1
                break
            fi
            sleep 2
        done
        if [ "$backend_ready" -ne 1 ]; then
            compose logs --tail=80 backend
            exit 1
        fi

        compose ps
        echo "Docker deployment successful!"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build backend image bundle
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag "$IMAGE_NAME:$IMAGE_TAG" .
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker save "$IMAGE_NAME:$IMAGE_TAG" postgres:16-alpine redis:7-alpine \
            | gzip > "$RUNNER_TEMP/$IMAGE_ARCHIVE"
          cp "$RUNNER_TEMP/$IMAGE_ARCHIVE" "$IMAGE_ARCHIVE"
          test -s "$IMAGE_ARCHIVE"

      - name: Upload Docker bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: ${{ env.IMAGE_ARCHIVE }},compose.production.yml
          target: /tmp/blog-backend-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: ${{ env.DEPLOY_SSH_CONNECT_TIMEOUT }}
          command_timeout: ${{ env.DEPLOY_COMMAND_TIMEOUT }}
          overwrite: true

      - name: Deploy Docker bundle via SSH (Attempt 1)
        id: deploy_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: ${{ env.DEPLOY_SSH_CONNECT_TIMEOUT }}
          command_timeout: ${{ env.DEPLOY_COMMAND_TIMEOUT }}
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait before retry 2
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 15

      - name: Deploy Docker bundle via SSH (Attempt 2)
        if: steps.deploy_1.outcome == 'failure'
        id: deploy_2
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: ${{ env.DEPLOY_SSH_CONNECT_TIMEOUT }}
          command_timeout: ${{ env.DEPLOY_COMMAND_TIMEOUT }}
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Wait before retry 3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: sleep 15

      - name: Deploy Docker bundle via SSH (Attempt 3)
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        id: deploy_3
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: ${{ env.DEPLOY_SSH_CONNECT_TIMEOUT }}
          command_timeout: ${{ env.DEPLOY_COMMAND_TIMEOUT }}
          script: ${{ env.DEPLOY_SCRIPT }}

      - name: Fail when all Docker deploy attempts fail
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure'
        run: |
          echo "Docker backend deploy failed after 3 SSH attempts."
          exit 1
